services:
    app:
        build:
            context: ./docker/Dockerfile
            target: php
            args:
                - APP_ENV=${APP_ENV}
        environment:
            - APP_ENV=${APP_ENV}
            - CONTAINER_ROLE=app
        working_dir: /var/www
        volumes: 
            ./:/var/www
    web:
        image: nginx:alpine
        container_name: docunest_web
        ports:
            - 8000:80
        volumes: 
            ./:/var/www/public
    db:
        image: mysql:8.0
        ports:
            - 3306:3306
        environment:
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
    redis:
        image: redis:alpine
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        ports:
            - 6379:6379
    nodejs:
        image: node:14.15.5-alpine3.12
        ports:
            - ""

networks:
    docunest_network:
        driver: bridge
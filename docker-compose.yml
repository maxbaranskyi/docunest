services:
    app:
        container_name: docunest_app
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: php
            args:
                - APP_ENV=${APP_ENV}
        environment:
            - APP_ENV=${APP_ENV}
            - CONTAINER_ROLE=app
        working_dir: /var/www
        volumes: 
            - .:/var/www:Z
        depends_on:
            - db
            - redis
        networks:
            - docunest_network
        user: "${UID}:${GID}"
    web:
        image: nginx:alpine
        container_name: docunest_web
        ports:
            - 8081:80
        volumes: 
            - ./public:/var/www/public:z
            - ./docker/nginx/:/etc/nginx/conf.d:z
        networks:
            - docunest_network
        depends_on:
            - app
    db:
        image: mysql:8.0
        ports:
            - 3306:3306
        environment:
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
    redis:
        image: redis:alpine
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        ports:
            - 6379:6379
        networks:
            - docunest_network
    nodejs:
        image: node:14.15.5-alpine3.12
        volumes:
            - .:/usr/src
            - ./node_modules/:/usr/src/node_modules:Z
        networks:
            - docunest_network

volumes:
    db-data: ~

networks:
    docunest_network:
        driver: bridge
